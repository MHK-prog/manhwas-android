apply plugin: 'com.android.application'

android {
    namespace 'com.mhkprog.manhwareader'
    compileSdk 36

    sourceSets {
        main {
            res.srcDir rootProject.file('icons')
        }
    }

    defaultConfig {
        applicationId 'com.mhkprog.manhwareader'
        minSdk 23
        targetSdk 36
        versionCode 170
        versionName '1.4.36'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    if (System.getenv('ANDROID_KEYSTORE_PATH')) {
        signingConfigs {
            stable {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storeType 'JKS'
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.stable
            }
        }
    }
}

def releaseVersionName = android.defaultConfig.versionName
tasks.register('copyNamedReleaseApk', Copy) {
    dependsOn tasks.named('assembleRelease')
    def releaseApkDirectory = layout.buildDirectory.dir('outputs/apk/release')
    from(releaseApkDirectory.map { it.file('app-release.apk') })
    into(layout.buildDirectory.dir('outputs/apk/manhwa-reader'))
    rename { "Manhwa-Reader-Android-v${releaseVersionName}.apk" }
}
