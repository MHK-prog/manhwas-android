<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'">
<title>پیگیری مطالعه</title>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#121212">

<style>
  @font-face {
    font-family: "Vazirmatn";
    src: url("./fonts/Vazirmatn-Variable.woff2") format("woff2");
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
  }
  :root {
    --bg: #121212; --surface: #1e1e1e; --text: #eee; --sub-text: #aaa;
    --border: #333; --primary: #bb86fc; --danger: #cf6679;
    --backdrop: rgba(0,0,0,0.7);
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  button { transition: transform .12s ease, filter .12s ease; }
  button:active:not(:disabled) { transform: scale(.97); filter: brightness(.9); }
  html, body, * {
    scrollbar-width: none;
    -ms-overflow-style: none;
    overscroll-behavior: none;
  }
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  button, input, dialog { font-family: inherit; }
  html { height: 100%; }
  body {
    font-family: "Vazirmatn", sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100%; min-height: 100dvh; margin: 0;
    display: flex; flex-direction: column;
    overflow-x: hidden;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  input, textarea { -webkit-user-select: text; user-select: text; }
  .hidden { display: none !important; }
  .content { flex: 1; min-width: 0; padding: 16px; }

  /* نوار ابزار */
  .header { display: flex; align-items: center; margin-bottom: 16px; }
  .chapter-header { width: 100%; justify-content: space-between; }
  .toolbar-state { display: flex; width: 100%; align-items: center; justify-content: space-between; }
  #main-toolbar { position: relative; }
  .list-mode-title { position: absolute; left: 50%; transform: translateX(-50%); color: var(--sub-text); font-size: .9rem; pointer-events: none; }
  .toolbar-icon {
    display: grid; place-items: center; width: 48px; height: 48px; padding: 0;
    border: 1px solid var(--border); border-radius: 50%; background: transparent;
    cursor: pointer; touch-action: manipulation;
  }
  .toolbar-icon img { width: 23px; height: 23px; }
  .toolbar-icon:disabled { opacity: .32; cursor: default; }
  .back-icon-btn {
    display: grid; place-items: center; width: 48px; height: 48px; padding: 0;
    border: 1.5px solid var(--primary); border-radius: 14px; background: transparent;
    cursor: pointer; touch-action: manipulation;
  }
  .back-icon-btn img { width: 24px; height: 24px; }
  .btn {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer;
    font: inherit; touch-action: manipulation;
  }
  .btn-primary { background: var(--primary); color: #121212; font-weight: bold; border: 0; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
  }

  /* کارت‌های فهرست */
  .manhwa-grid {
    display: flex; flex-direction: column; gap: 12px; align-items: stretch;
  }
  .manhwa-card {
    min-width: 0; padding: 12px; border: 1px solid var(--border);
    border-radius: 14px; background: var(--surface); cursor: pointer;
    touch-action: pan-y; user-select: none; -webkit-user-select: none;
    transition: border-color .15s ease, background .15s ease, transform .12s ease;
  }
  .manhwa-card:active { transform: scale(.99); }
  .manhwa-card.selected { padding: 11px; border: 2px solid var(--primary); background: #251d2e; }
  .manhwa-card:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .manhwa-card-main { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .cover-frame {
    position: relative; display: grid; place-items: center; width: 82px; height: 114px;
    flex: 0 0 82px; overflow: hidden; border: 1px solid var(--border);
    border-radius: 9px; background: var(--bg); cursor: zoom-in; touch-action: pan-y;
    -webkit-user-drag: none; user-select: none; -webkit-user-select: none;
  }
  .cover-frame img { pointer-events: none; -webkit-user-drag: none; user-drag: none; }
  .cover-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cover-placeholder { width: 42px; height: 42px; opacity: .8; }
  .detail-metrics { flex: 1; min-width: 0; }
  .card-title {
    margin: 0 0 12px; color: var(--text); font-size: 1.05rem; line-height: 1.4;
    overflow-wrap: anywhere;
  }
  .detail-sub { font-size: .82rem; color: var(--sub-text); display: flex; justify-content: space-between; gap: 8px; }
  .detail-last { font-size: .78rem; color: var(--sub-text); margin-top: 8px; line-height: 1.5; }
  .empty-state { text-align: center; color: var(--sub-text); margin-top: 40px; }
  .edit-cover-row { display: flex; align-items: center; gap: 14px; }
  .edit-cover-preview { display: grid; place-items: center; width: 76px; height: 106px; flex: 0 0 76px; overflow: hidden; border: 1px solid var(--border); border-radius: 9px; background: var(--bg); }
  .edit-cover-preview img { width: 100%; height: 100%; object-fit: cover; }
  .edit-cover-preview .cover-placeholder { width: 38px; height: 38px; }
  .cover-viewer { display: grid; place-items: center; min-height: 40dvh; }
  .cover-viewer img { display: block; max-width: 100%; max-height: 70dvh; object-fit: contain; border-radius: 8px; }

  /* نوار پیشرفت در صفحه لیست */
  .bar-bg { height: 6px; background: #2a2a2a; border-radius: 99px; margin-top: 8px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--primary); transition: width 0.2s ease; }

  /* چیپ‌ها (چپترها) */
  .chips {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
    gap: 8px; margin-top: 16px; user-select: none;
    -webkit-user-select: none;
  }
  .chip {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 6px; text-align: center; font-size: 0.9rem; cursor: pointer;
    touch-action: pan-y; /* اسکرول عمودی بدون مشکل کار می‌کنه */
  }
  .chip.on { background: var(--primary); color: #121212; font-weight: bold; border-color: var(--primary); }

  /* مودال‌ها */
  dialog {
    border: 1px solid var(--border); border-radius: 12px; padding: 20px;
    width: 90%; max-width: 400px; max-height: 86dvh; overflow-y: auto;
    background: var(--surface); color: var(--text);
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  dialog::backdrop { background: var(--backdrop); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .modal-head h3 { margin: 0; }
  .modal-close { background: none; border: 0; color: var(--sub-text); font-size: 1.3rem; cursor: pointer; padding: 4px; }
  form { display: flex; flex-direction: column; gap: 12px; }
  input {
    padding: 12px; border: 1px solid var(--border); border-radius: 8px;
    font: inherit; background: var(--bg); color: var(--text); outline: none;
  }
  input:focus { border-color: var(--primary); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }

  /* سایدبار کشویی */
  .backdrop {
    position: fixed; inset: 0; background: var(--backdrop);
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 10;
  }
  .sidebar {
    position: fixed; top: 0; right: 0; height: 100%; width: min(300px, 84vw);
    background: var(--surface); border-left: 1px solid var(--border);
    transform: translateX(100%); transition: transform 0.2s ease;
    padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; z-index: 11;
  }
  body.menu-open .sidebar { transform: translateX(0); }
  body.menu-open .backdrop { opacity: 1; pointer-events: auto; }
  .side-btn { width: 100%; text-align: right; padding: 12px; font-weight: 600; }

  footer { text-align: center; padding: 16px 0 8px; font-size: 0.8rem; color: var(--sub-text); direction: ltr; }
</style>
</head>
<body>

  <!-- سایدبار و پرده تاریک -->
  <div class="backdrop" id="backdrop"></div>
  <aside class="sidebar" id="sidebar">
    <h3 style="margin-top:0;">منو برنامه</h3>
    <button class="btn side-btn" id="btn-library-main">فهرست اصلی</button>
    <button class="btn side-btn" id="btn-library-hidden">کتابخانهٔ مخفی</button>
    <button class="btn side-btn" id="btn-storage">انتخاب پوشهٔ ذخیره‌سازی</button>
    <button class="btn side-btn" id="btn-export">پشتیبان‌گیری از اطلاعات</button>
    <p id="storage-status" style="font-size:0.8rem; color:var(--sub-text); line-height:1.6; margin:0;">تا انتخاب پوشه، اطلاعات در حافظهٔ برنامه ذخیره می‌شوند.</p>
    <span style="font-size:0.8rem; color:var(--sub-text); margin-top:auto; line-height:1.6;">
      با بکاپ‌گیری دیتات هیچ‌وقت از بین نمیره.
    </span>
  </aside>

  <input type="file" id="cover-picker" accept="image/*" class="hidden">

  <div class="content">
    <!-- فهرست -->
    <div id="view-list">
      <div class="header">
        <div id="main-toolbar" class="toolbar-state">
          <button class="toolbar-icon" id="btn-menu" aria-label="بازکردن منو">
            <img src="./icons/menu.svg" alt="">
          </button>
          <span id="list-mode-title" class="list-mode-title hidden">کتابخانهٔ مخفی</span>
          <button class="toolbar-icon" id="btn-open-add" aria-label="افزودن مورد">
            <img src="./icons/plus.svg" alt="">
          </button>
        </div>
        <div id="selection-toolbar" class="toolbar-state hidden">
          <button class="toolbar-icon" id="btn-delete-selected" aria-label="حذف موارد انتخاب‌شده">
            <img src="./icons/trash.svg" alt="">
          </button>
          <button class="toolbar-icon" id="btn-toggle-hidden-selected" aria-label="مخفی کردن موارد انتخاب‌شده">
            <img id="btn-visibility-icon" src="./icons/eye-off.svg" alt="">
          </button>
          <button class="toolbar-icon" id="btn-edit-selected" aria-label="ویرایش مورد انتخاب‌شده" disabled>
            <img src="./icons/edit.svg" alt="">
          </button>
        </div>
      </div>
      <div id="manhwa-list" class="manhwa-grid"></div>
    </div>

    <!-- صفحه چپترها -->
    <div id="view-chapters" class="hidden">
      <div class="header chapter-header">
        <button class="back-icon-btn" id="btn-chapters-back" aria-label="بازگشت به فهرست">
          <img src="./icons/arrow-right.svg" alt="">
        </button>
        <span id="detail-progress" style="font-size:0.9rem; color:var(--sub-text)"></span>
      </div>
      <h2 id="chapters-title" style="margin:0 0 6px;"></h2>
      <div id="chips-container" class="chips"></div>
    </div>
  </div>

  <footer>v2.4.0</footer>

  <!-- مودال چندمنظوره و سراسری -->
  <dialog id="app-modal">
    <div class="modal-head">
      <h3 id="modal-title"></h3>
      <button class="modal-close" data-close>&times;</button>
    </div>
    <div id="modal-body"></div>
  </dialog>

<script>
const KEY = 'manhwas';
let nativeStorage = typeof AndroidStorage !== 'undefined';
const createId = () => `m-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
let loadedData = JSON.parse((nativeStorage && AndroidStorage.loadData()) || localStorage.getItem(KEY) || '[]');
let needsMigration = false;
function normalizeManhwa(item) {
  const m = item && typeof item === 'object' ? item : {};
  if (typeof m.id !== 'string' || !/^[A-Za-z0-9_-]{1,80}$/.test(m.id)) {
    m.id = createId();
    needsMigration = true;
  }
  m.title = String(m.title || 'بدون نام');
  m.total = Math.max(1, Number(m.total) || 1);
  m.read = Array.isArray(m.read) ? [...new Set(m.read.map(Number).filter(n => Number.isInteger(n) && n > 0 && n <= m.total))].sort((a, b) => a - b) : [];
  if (m.cover !== `cover-${m.id}.jpg`) m.cover = null;
  m.hidden = m.hidden === true;
  return m;
}
let data = (Array.isArray(loadedData) ? loadedData : []).map(normalizeManhwa);
let activeIndex = null;
let currentSet = new Set();
let pendingBrowserCoverId = null;
let selectedIds = new Set();
let pendingDeleteIds = [];
let listMode = 'main';
let modalEntry = null;
let modalEntryIsNew = false;
let holdTimer = null;
let holdOrigin = null;
let holdTriggered = false;
let suppressCardClick = false;
const escapeHtml = (value) => String(value).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

const save = () => {
  const serialized = JSON.stringify(data);
  localStorage.setItem(KEY, serialized);
  if (nativeStorage) AndroidStorage.saveData(serialized);
};
if (needsMigration) save();

function getCoverUrl(m) {
  if (m.coverData) return m.coverData;
  if (m.cover === `cover-${m.id}.jpg`) return `https://appassets.androidplatform.net/covers/${encodeURIComponent(m.cover)}?v=${Number(m.coverUpdated) || 0}`;
  return '';
}

/* =========================================
   مودال عمومی
========================================= */
const appModal = document.getElementById('app-modal');

appModal.addEventListener('click', (e) => {
  const r = appModal.getBoundingClientRect();
  const clickedOutside = e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
  if (clickedOutside || e.target.closest('[data-close]')) appModal.close();
});
appModal.addEventListener('close', () => {
  if (modalEntryIsNew && modalEntry && !data.includes(modalEntry) && nativeStorage) {
    AndroidStorage.deleteCover(modalEntry.id);
  }
  modalEntry = null;
  modalEntryIsNew = false;
  pendingBrowserCoverId = null;
});

function openModal(title, contentHtml) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = contentHtml;
  appModal.showModal();
}

/* =========================================
   کنترل صفحات و لیست
========================================= */
function showView(view) {
  document.getElementById('view-list').classList.toggle('hidden', view !== 'list');
  document.getElementById('view-chapters').classList.toggle('hidden', view !== 'chapters');
  if (view === 'list') { activeIndex = null; renderList(); }
  if (view === 'chapters') renderChapters();
}

function showLibrary(mode) {
  listMode = mode;
  selectedIds.clear();
  toggleMenu(false);
  showView('list');
}

function renderList() {
  const cont = document.getElementById('manhwa-list');
  const entries = data.map((item, index) => ({ item, index }))
    .filter(({ item }) => (item.hidden === true) === (listMode === 'hidden'));
  if (!entries.length) {
    cont.innerHTML = listMode === 'hidden'
      ? '<p class="empty-state">کتابخانهٔ مخفی خالی است.</p>'
      : '<p class="empty-state">هنوز موردی اضافه نشده است.</p>';
    updateToolbar();
    return;
  }
  cont.innerHTML = entries.map(({ item: m, index: i }) => {
    const image = getCoverUrl(m);
    const pct = Math.min(100, Math.round((m.read.length / m.total) * 100));
    const lastRead = m.read.length ? Math.max(...m.read) : 0;
    return `
      <article class="manhwa-card" data-index="${i}" data-id="${escapeHtml(m.id)}" role="button" tabindex="0" aria-pressed="false">
        <div class="manhwa-card-main">
          <div class="cover-frame" aria-label="نمایش تصویر جلد">
            <img class="cover-placeholder" src="./icons/book.svg" alt="" draggable="false">
            ${image ? `<img class="cover-image" src="${escapeHtml(image)}" alt="جلد ${escapeHtml(m.title)}" draggable="false" onerror="this.remove()">` : ''}
          </div>
          <div class="detail-metrics">
            <h2 class="card-title">${escapeHtml(m.title)}</h2>
            <div class="detail-sub"><span>${m.read.length} از ${m.total} چپتر</span><span>${pct}%</span></div>
            <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
            <div class="detail-last">${lastRead ? `آخرین چپتر خوانده‌شده: ${lastRead}` : 'هنوز چپتری تیک نخورده است'}</div>
          </div>
        </div>
      </article>
    `;
  }).join('');
  updateToolbar();
}

function updateToolbar() {
  const selecting = selectedIds.size > 0;
  document.getElementById('main-toolbar').classList.toggle('hidden', selecting);
  document.getElementById('selection-toolbar').classList.toggle('hidden', !selecting);
  document.getElementById('btn-open-add').classList.toggle('hidden', listMode === 'hidden');
  document.getElementById('list-mode-title').classList.toggle('hidden', listMode !== 'hidden');
  document.getElementById('btn-edit-selected').disabled = selectedIds.size !== 1;
  const visibilityButton = document.getElementById('btn-toggle-hidden-selected');
  const visibilityIcon = document.getElementById('btn-visibility-icon');
  const restoring = listMode === 'hidden';
  visibilityButton.setAttribute('aria-label', restoring ? 'بازگرداندن موارد انتخاب‌شده' : 'مخفی کردن موارد انتخاب‌شده');
  visibilityIcon.src = restoring ? './icons/eye.svg' : './icons/eye-off.svg';
  document.querySelectorAll('.manhwa-card').forEach((card) => {
    const selected = selectedIds.has(card.dataset.id);
    card.classList.toggle('selected', selected);
    card.setAttribute('aria-pressed', String(selected));
  });
}

function toggleCardSelection(id) {
  if (!data.some((item) => item.id === id)) return;
  if (selectedIds.has(id)) selectedIds.delete(id);
  else selectedIds.add(id);
  updateToolbar();
}

function renderEditCoverPreview(entry = modalEntry) {
  const preview = document.getElementById('edit-cover-preview');
  if (!preview || !entry) return;
  const image = getCoverUrl(entry);
  preview.innerHTML = image
    ? `<img src="${escapeHtml(image)}" alt="">`
    : '<img src="./icons/book.svg" alt="">';
}

function chooseCover() {
  if (!modalEntry) return;
  if (nativeStorage) {
    AndroidStorage.chooseCover(modalEntry.id);
    return;
  }
  pendingBrowserCoverId = modalEntry.id;
  document.getElementById('cover-picker').click();
}

document.getElementById('cover-picker').addEventListener('change', (event) => {
  const file = event.target.files?.[0];
  const targetId = pendingBrowserCoverId;
  pendingBrowserCoverId = null;
  event.target.value = '';
  if (!file || !targetId) return;
  const reader = new FileReader();
  reader.onload = () => {
    const picture = new Image();
    picture.onload = () => {
      const scale = Math.min(1, 700 / picture.width, 1000 / picture.height);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(picture.width * scale);
      canvas.height = Math.round(picture.height * scale);
      canvas.getContext('2d').drawImage(picture, 0, 0, canvas.width, canvas.height);
      const target = data.find((item) => item.id === targetId)
        || (modalEntry?.id === targetId ? modalEntry : null);
      if (!target) return;
      target.coverData = canvas.toDataURL('image/jpeg', 0.82);
      target.cover = null;
      target.coverUpdated = Date.now();
      if (data.includes(target)) {
        save();
        renderList();
      }
      renderEditCoverPreview(target);
    };
    picture.src = reader.result;
  };
  reader.readAsDataURL(file);
});

window.onAndroidCoverSaved = (id) => {
  const target = data.find((item) => item.id === id)
    || (modalEntry?.id === id ? modalEntry : null);
  if (!target) return;
  target.cover = `cover-${id}.jpg`;
  target.coverUpdated = Date.now();
  delete target.coverData;
  if (data.includes(target)) {
    save();
    renderList();
  }
  renderEditCoverPreview(target);
};
window.onAndroidCoverError = (_id, message) => alert(message || 'ذخیرهٔ جلد انجام نشد. پوشهٔ انتخاب‌شده را بررسی کن.');

function openCoverPreview(entry) {
  const image = getCoverUrl(entry);
  if (!image) return;
  openModal('نمایش جلد', `<div class="cover-viewer"><img src="${escapeHtml(image)}" alt="جلد ${escapeHtml(entry.title)}"></div>`);
}

function openChapters() {
  if (activeIndex === null) return;
  showView('chapters');
}

function renderChapters() {
  const m = data[activeIndex];
  if (!m) return showView('list');
  document.getElementById('chapters-title').textContent = m.title;
  currentSet = new Set(m.read);
  updateCounter();

  let html = '';
  for (let i = 1; i <= m.total; i++) {
    html += `<div class="chip ${currentSet.has(i) ? 'on' : ''}" id="chapter-${i}" data-ch="${i}">${i}</div>`;
  }
  document.getElementById('chips-container').innerHTML = html;
  const targetChapter = m.read.length ? Math.max(...m.read) : 1;
  requestAnimationFrame(() => document.getElementById(`chapter-${targetChapter}`)?.scrollIntoView({ block: 'center', behavior: 'smooth' }));
}

function updateCounter() {
  const m = data[activeIndex];
  document.getElementById('detail-progress').textContent = `${currentSet.size} / ${m.total}`;
}

/* =========================================
   تیک زدن تکی با تشخیص خودکار اسکرول (بدون لگ)
========================================= */
const chipsContainer = document.getElementById('chips-container');

// رویداد click خودش ذاتاً فرق اسکرول و کلیک واقعی رو در موبایل و دسکتاپ تشخیص میده
chipsContainer.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;

  const ch = +chip.dataset.ch;
  if (currentSet.has(ch)) {
    currentSet.delete(ch);
    chip.classList.remove('on');
  } else {
    currentSet.add(ch);
    chip.classList.add('on');
  }

  updateCounter();
  data[activeIndex].read = Array.from(currentSet).sort((a, b) => a - b);
  save();
  renderList();
});

/* =========================================
   مودال‌های افزودن، ویرایش و حذف
========================================= */
document.getElementById('btn-open-add').onclick = () => {
  openManhwaEditor();
};

function openManhwaEditor(index = null) {
  const existing = Number.isInteger(index) ? data[index] : null;
  modalEntryIsNew = !existing;
  modalEntry = existing || {
    id: createId(), title: '', total: 1, read: [], cover: null,
    hidden: listMode === 'hidden',
  };
  const m = modalEntry;
  const maxRead = m.read.length ? Math.max(...m.read) : 0;

  openModal(modalEntryIsNew ? 'افزودن' : 'ویرایش', `
    <form onsubmit="saveManhwa(event)">
      <div class="edit-cover-row">
        <div class="edit-cover-preview" id="edit-cover-preview"></div>
        <button type="button" class="btn" id="btn-entry-cover">انتخاب تصویر جلد</button>
      </div>
      <input id="entry-title" placeholder="عنوان" required>
      <input id="entry-total" type="number" min="1" placeholder="تعداد کل چپترها" required>
      <input id="entry-readto" type="number" min="0" placeholder="تا چپتر چند خوندی؟ (مثلا 180)">
      <div class="modal-actions">
        <button type="button" class="btn" data-close>انصراف</button>
        <button type="submit" class="btn btn-primary">${modalEntryIsNew ? 'ذخیره' : 'ثبت تغییرات'}</button>
      </div>
    </form>
  `);
  document.getElementById('entry-title').value = m.title;
  document.getElementById('entry-total').value = existing ? m.total : '';
  document.getElementById('entry-readto').value = existing ? maxRead : '';
  renderEditCoverPreview(m);
  document.getElementById('btn-entry-cover').onclick = chooseCover;
}

function editManhwa(index) {
  openManhwaEditor(index);
}

window.saveManhwa = (e) => {
  e.preventDefault();
  const m = modalEntry;
  if (!m) return;
  const title = document.getElementById('entry-title').value.trim();
  const total = +document.getElementById('entry-total').value;
  if (!title || total < 1) return;
  m.title = title;
  m.total = total;

  let readTo = +(document.getElementById('entry-readto').value || 0);
  if (readTo > m.total) readTo = m.total;

  m.read = [];
  for (let i = 1; i <= readTo; i++) m.read.push(i);

  if (modalEntryIsNew) data.push(m);
  modalEntryIsNew = false;
  save();
  selectedIds.clear();
  renderList();
  appModal.close();
};

function askDeleteSelected() {
  pendingDeleteIds = [...selectedIds];
  if (!pendingDeleteIds.length) return;
  const message = pendingDeleteIds.length === 1
    ? 'این مورد حذف شود؟'
    : `${pendingDeleteIds.length} مورد حذف شوند؟`;
  openModal('حذف', `
    <p style="color:var(--sub-text); margin: 0 0 16px;">${message}</p>
    <div class="modal-actions">
      <button class="btn" data-close>انصراف</button>
      <button class="btn" id="confirm-delete" style="background:var(--danger); color:#fff; border:0;">حذف</button>
    </div>
  `);
  document.getElementById('confirm-delete').onclick = confirmDeleteSelected;
}

function confirmDeleteSelected() {
  const deleting = new Set(pendingDeleteIds);
  if (nativeStorage) {
    deleting.forEach((id) => AndroidStorage.deleteCover(id));
  }
  data = data.filter((item) => !deleting.has(item.id));
  pendingDeleteIds = [];
  selectedIds.clear();
  save();
  renderList();
  appModal.close();
}

function toggleSelectedVisibility() {
  if (!selectedIds.size) return;
  const hide = listMode !== 'hidden';
  data.forEach((item) => {
    if (selectedIds.has(item.id)) item.hidden = hide;
  });
  selectedIds.clear();
  save();
  renderList();
}

/* =========================================
   سایدبار و سوایپ لمسی
========================================= */
const toggleMenu = (open) => document.body.classList.toggle('menu-open', open);

window.handleNativeBack = () => {
  if (appModal.open) { appModal.close(); return true; }
  if (document.body.classList.contains('menu-open')) { toggleMenu(false); return true; }
  if (!document.getElementById('view-chapters').classList.contains('hidden')) { showView('list'); return true; }
  if (selectedIds.size) { selectedIds.clear(); updateToolbar(); return true; }
  if (listMode === 'hidden') { showLibrary('main'); return true; }
  return false;
};

const manhwaList = document.getElementById('manhwa-list');
manhwaList.addEventListener('pointerdown', (event) => {
  const card = event.target.closest('.manhwa-card');
  if (!card || selectedIds.size || (event.pointerType === 'mouse' && event.button !== 0)) return;
  const index = Number(card.dataset.index);
  if (!data[index]) return;
  holdOrigin = { x: event.clientX, y: event.clientY, index };
  holdTriggered = false;
  holdTimer = setTimeout(() => {
    holdTimer = null;
    holdTriggered = true;
    toggleCardSelection(data[index].id);
  }, 480);
});

manhwaList.addEventListener('pointermove', (event) => {
  if (!holdOrigin) return;
  if (Math.hypot(event.clientX - holdOrigin.x, event.clientY - holdOrigin.y) > 12) {
    clearTimeout(holdTimer);
    holdTimer = null;
    holdOrigin = null;
  }
});

manhwaList.addEventListener('pointerup', () => {
  clearTimeout(holdTimer);
  holdTimer = null;
  holdOrigin = null;
  if (holdTriggered) {
    suppressCardClick = true;
    holdTriggered = false;
    setTimeout(() => { suppressCardClick = false; }, 700);
  }
});

manhwaList.addEventListener('pointercancel', () => {
  clearTimeout(holdTimer);
  holdTimer = null;
  holdOrigin = null;
  holdTriggered = false;
});

manhwaList.addEventListener('contextmenu', (event) => {
  if (event.target.closest('.manhwa-card')) event.preventDefault();
});

manhwaList.addEventListener('click', (event) => {
  if (suppressCardClick) { event.preventDefault(); suppressCardClick = false; return; }
  const card = event.target.closest('.manhwa-card');
  if (!card) return;
  const index = Number(card.dataset.index);
  const item = data[index];
  if (!item) return;
  if (selectedIds.size) {
    toggleCardSelection(item.id);
    return;
  }
  if (event.target.closest('.cover-frame') && getCoverUrl(item)) {
    openCoverPreview(item);
    return;
  }
  activeIndex = index;
  openChapters();
});

manhwaList.addEventListener('keydown', (event) => {
  if (event.key !== 'Enter' && event.key !== ' ') return;
  const card = event.target.closest('.manhwa-card');
  if (!card) return;
  event.preventDefault();
  const index = Number(card.dataset.index);
  const item = data[index];
  if (!item) return;
  suppressCardClick = true;
  setTimeout(() => { suppressCardClick = false; }, 0);
  if (selectedIds.size) toggleCardSelection(item.id);
  else { activeIndex = index; openChapters(); }
});

document.getElementById('btn-menu').onclick = () => toggleMenu(true);
document.getElementById('btn-delete-selected').onclick = askDeleteSelected;
document.getElementById('btn-toggle-hidden-selected').onclick = toggleSelectedVisibility;
document.getElementById('btn-edit-selected').onclick = () => {
  if (selectedIds.size !== 1) return;
  const index = data.findIndex((item) => selectedIds.has(item.id));
  if (index >= 0) editManhwa(index);
};
document.getElementById('btn-library-main').onclick = () => showLibrary('main');
document.getElementById('btn-library-hidden').onclick = () => showLibrary('hidden');
document.getElementById('backdrop').onclick = () => toggleMenu(false);
document.getElementById('btn-chapters-back').onclick = () => showView('list');

let touchStartX = 0;
document.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
}, { passive: true });

document.addEventListener('touchend', (e) => {
  const diffX = e.changedTouches[0].clientX - touchStartX;
  const isFromRightEdge = touchStartX > window.innerWidth - 30;

  if (isFromRightEdge && diffX < -50) toggleMenu(true);
  if (document.body.classList.contains('menu-open') && diffX > 60) toggleMenu(false);
}, { passive: true });

/* =========================================
   پشتیبان‌گیری (Export / Import)
========================================= */
document.getElementById('btn-export').onclick = () => {
  if (nativeStorage) {
    AndroidStorage.exportBackup(JSON.stringify(data, null, 2));
    toggleMenu(false);
    return;
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `reading-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  toggleMenu(false);
};

document.getElementById('btn-storage').onclick = () => {
  if (nativeStorage) AndroidStorage.chooseFolder();
  else alert('برای انتخاب پوشه، نسخهٔ اندروید را نصب کنید.');
};

window.onAndroidFolderPicked = (serialized, folderName) => {
  if (serialized) {
    const saved = JSON.parse(serialized);
    needsMigration = false;
    data = (Array.isArray(saved) ? saved : []).map(normalizeManhwa);
  }
  localStorage.setItem(KEY, JSON.stringify(data));
  save();
  document.getElementById('storage-status').textContent = `پوشهٔ ذخیره‌سازی: ${folderName}`;
  renderList();
};
window.onAndroidStorageReady = (folderName) => {
  if (folderName) document.getElementById('storage-status').textContent = `پوشهٔ ذخیره‌سازی: ${folderName}`;
};

// اجرای اولیه
showView('list');
</script>
<script>
  if (!(typeof AndroidStorage !== "undefined") && "serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js");
    });
  }
</script>

</body>
</html>
