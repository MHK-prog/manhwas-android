<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'">
<title>مانهواهام</title>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#121212">

<style>
  :root {
    --bg: #121212; --surface: #1e1e1e; --text: #eee; --sub-text: #aaa;
    --border: #333; --primary: #bb86fc; --danger: #cf6679;
    --backdrop: rgba(0,0,0,0.7);
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    font-family: system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100%; min-height: 100dvh; margin: 0;
    display: flex; flex-direction: column;
    overflow-x: hidden;
  }
  .hidden { display: none !important; }
  .content { flex: 1; min-width: 0; padding: 16px; }

  /* هدر */
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .header-actions { display: flex; align-items: center; gap: 10px; }
  .btn {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer;
    font: inherit; touch-action: manipulation;
  }
  .btn-primary { background: var(--primary); color: #121212; font-weight: bold; border: 0; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
  }

  /* کارت‌های فهرست */
  .manhwa-grid {
    display: flex; flex-direction: column; gap: 12px; align-items: stretch;
  }
  .manhwa-card {
    min-width: 0; padding: 12px; border: 1px solid var(--border);
    border-radius: 14px; background: var(--surface);
  }
  .manhwa-card-main { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .cover-button {
    position: relative; display: block; width: 96px; flex: 0 0 96px; aspect-ratio: 0.72;
    padding: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 9px;
    background: var(--bg); color: var(--sub-text); cursor: pointer; touch-action: manipulation;
  }
  .cover-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cover-placeholder {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; width: 100%; height: 100%; padding: 8px; text-align: center;
  }
  .cover-placeholder svg { width: 38px; height: 38px; color: var(--primary); }
  .cover-hint { font-size: 0.72rem; line-height: 1.4; }
  .detail-metrics { flex: 1; min-width: 0; }
  .card-title {
    margin: 0 0 12px; color: var(--text); font-size: 1.05rem; line-height: 1.4;
    overflow-wrap: anywhere;
  }
  .detail-sub { font-size: .82rem; color: var(--sub-text); display: flex; justify-content: space-between; gap: 8px; }
  .detail-last { font-size: .78rem; color: var(--sub-text); margin-top: 8px; line-height: 1.5; }
  .detail-actions { display: grid; grid-template-columns: 1.2fr 1fr .8fr; gap: 8px; margin-top: 12px; }
  .detail-actions .btn { min-width: 0; padding: 8px 5px; font-size: .86rem; }
  .empty-state { text-align: center; color: var(--sub-text); margin-top: 40px; }
  .danger-button { color: #fff; background: var(--danger); border: 0; }

  /* نوار پیشرفت در صفحه لیست */
  .bar-bg { height: 6px; background: #2a2a2a; border-radius: 99px; margin-top: 8px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--primary); transition: width 0.2s ease; }

  /* چیپ‌ها (چپترها) */
  .chips {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
    gap: 8px; margin-top: 16px; user-select: none;
    -webkit-user-select: none;
  }
  .chip {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 6px; text-align: center; font-size: 0.9rem; cursor: pointer;
    touch-action: pan-y; /* اسکرول عمودی بدون مشکل کار می‌کنه */
  }
  .chip.on { background: var(--primary); color: #121212; font-weight: bold; border-color: var(--primary); }

  /* مودال‌ها */
  dialog {
    border: 1px solid var(--border); border-radius: 12px; padding: 20px;
    width: 90%; max-width: 400px; background: var(--surface); color: var(--text);
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  dialog::backdrop { background: var(--backdrop); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .modal-head h3 { margin: 0; }
  .modal-close { background: none; border: 0; color: var(--sub-text); font-size: 1.3rem; cursor: pointer; padding: 4px; }
  form { display: flex; flex-direction: column; gap: 12px; }
  input {
    padding: 12px; border: 1px solid var(--border); border-radius: 8px;
    font: inherit; background: var(--bg); color: var(--text); outline: none;
  }
  input:focus { border-color: var(--primary); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }

  /* سایدبار کشویی */
  .backdrop {
    position: fixed; inset: 0; background: var(--backdrop);
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 10;
  }
  .sidebar {
    position: fixed; top: 0; right: 0; height: 100%; width: min(300px, 84vw);
    background: var(--surface); border-left: 1px solid var(--border);
    transform: translateX(100%); transition: transform 0.2s ease;
    padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; z-index: 11;
  }
  body.menu-open .sidebar { transform: translateX(0); }
  body.menu-open .backdrop { opacity: 1; pointer-events: auto; }
  .side-btn { width: 100%; text-align: right; padding: 12px; font-weight: 600; }

  footer { text-align: center; padding: 16px 0 8px; font-size: 0.8rem; color: var(--sub-text); direction: ltr; }
</style>
</head>
<body>

  <!-- سایدبار و پرده تاریک -->
  <div class="backdrop" id="backdrop"></div>
  <aside class="sidebar" id="sidebar">
    <h3 style="margin-top:0;">منو برنامه</h3>
    <button class="btn side-btn" id="btn-storage">انتخاب پوشهٔ ذخیره‌سازی</button>
    <button class="btn side-btn" id="btn-export">پشتیبان‌گیری از اطلاعات</button>
    <p id="storage-status" style="font-size:0.8rem; color:var(--sub-text); line-height:1.6; margin:0;">تا انتخاب پوشه، اطلاعات در حافظهٔ برنامه ذخیره می‌شوند.</p>
    <span style="font-size:0.8rem; color:var(--sub-text); margin-top:auto; line-height:1.6;">
      با بکاپ‌گیری دیتات هیچ‌وقت از بین نمیره.
    </span>
  </aside>

  <input type="file" id="cover-picker" accept="image/*" class="hidden">

  <div class="content">
    <!-- صفحه ۱: لیست مانهواها -->
    <div id="view-list">
      <div class="header">
        <div class="header-actions">
          <button class="icon-btn" id="btn-menu" aria-label="منو">
            <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <h2 style="margin:0">مانهواها</h2>
        </div>
        <button class="btn btn-primary" id="btn-open-add">+ افزودن</button>
      </div>
      <div id="manhwa-list" class="manhwa-grid"></div>
    </div>

    <!-- صفحه چپترها -->
    <div id="view-chapters" class="hidden">
      <div class="header">
        <button class="btn" id="btn-chapters-back">← فهرست</button>
        <div class="header-actions">
          <span id="detail-progress" style="font-size:0.9rem; color:var(--sub-text)"></span>
        </div>
      </div>
      <h2 id="chapters-title" style="margin:0 0 6px;"></h2>
      <div id="chips-container" class="chips"></div>
    </div>
  </div>

  <footer>v2.2.0</footer>

  <!-- مودال چندمنظوره و سراسری -->
  <dialog id="app-modal">
    <div class="modal-head">
      <h3 id="modal-title"></h3>
      <button class="modal-close" data-close>&times;</button>
    </div>
    <div id="modal-body"></div>
  </dialog>

<script>
const KEY = 'manhwas';
let nativeStorage = typeof AndroidStorage !== 'undefined';
const createId = () => `m-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
let loadedData = JSON.parse((nativeStorage && AndroidStorage.loadData()) || localStorage.getItem(KEY) || '[]');
let needsMigration = false;
function normalizeManhwa(item) {
  const m = item && typeof item === 'object' ? item : {};
  if (typeof m.id !== 'string' || !/^[A-Za-z0-9_-]{1,80}$/.test(m.id)) {
    m.id = createId();
    needsMigration = true;
  }
  m.title = String(m.title || 'بدون نام');
  m.total = Math.max(1, Number(m.total) || 1);
  m.read = Array.isArray(m.read) ? [...new Set(m.read.map(Number).filter(n => Number.isInteger(n) && n > 0 && n <= m.total))].sort((a, b) => a - b) : [];
  if (m.cover !== `cover-${m.id}.jpg`) m.cover = null;
  return m;
}
let data = (Array.isArray(loadedData) ? loadedData : []).map(normalizeManhwa);
let activeIndex = null;
let currentSet = new Set();
let pendingBrowserCoverIndex = null;
const escapeHtml = (value) => String(value).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

const save = () => {
  const serialized = JSON.stringify(data);
  localStorage.setItem(KEY, serialized);
  if (nativeStorage) AndroidStorage.saveData(serialized);
};
if (needsMigration) save();

function getCoverUrl(m) {
  if (m.coverData) return m.coverData;
  if (m.cover === `cover-${m.id}.jpg`) return `https://appassets.androidplatform.net/covers/${encodeURIComponent(m.cover)}?v=${Number(m.coverUpdated) || 0}`;
  return '';
}

/* =========================================
   مودال عمومی
========================================= */
const appModal = document.getElementById('app-modal');

appModal.addEventListener('click', (e) => {
  const r = appModal.getBoundingClientRect();
  const clickedOutside = e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
  if (clickedOutside || e.target.closest('[data-close]')) appModal.close();
});

function openModal(title, contentHtml) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = contentHtml;
  appModal.showModal();
}

/* =========================================
   کنترل صفحات و لیست
========================================= */
function showView(view) {
  document.getElementById('view-list').classList.toggle('hidden', view !== 'list');
  document.getElementById('view-chapters').classList.toggle('hidden', view !== 'chapters');
  if (view === 'list') { activeIndex = null; renderList(); }
  if (view === 'chapters') renderChapters();
}

function renderList() {
  const cont = document.getElementById('manhwa-list');
  if (!data.length) {
    cont.innerHTML = '<p class="empty-state">هنوز مانهوایی ثبت نکردی.</p>';
    return;
  }
  cont.innerHTML = data.map((m, i) => {
    const image = getCoverUrl(m);
    const pct = Math.min(100, Math.round((m.read.length / m.total) * 100));
    const lastRead = m.read.length ? Math.max(...m.read) : 0;
    return `
      <article class="manhwa-card" data-index="${i}">
        <div class="manhwa-card-main">
          <button class="cover-button" onclick="chooseCover(${i})" aria-label="انتخاب جلد برای ${escapeHtml(m.title)}">
            <span class="cover-placeholder ${image ? 'hidden' : ''}">
              <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 9.5c5.7-2.2 11.1-1.8 16 1.3v28c-4.9-3.1-10.3-3.5-16-1.3v-28Zm32 0c-5.7-2.2-11.1-1.8-16 1.3v28c4.9-3.1 10.3-3.5 16-1.3v-28Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M12 17c3.2-.8 6-.4 8.5 1M12 23c3.2-.8 6-.4 8.5 1m7-6c2.5-1.4 5.3-1.8 8.5-1m-8.5 7c2.5-1.4 5.3-1.8 8.5-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              <span class="cover-hint">برای افزودن جلد لمس کن</span>
            </span>
            ${image ? `<img class="cover-image" src="${escapeHtml(image)}" alt="جلد ${escapeHtml(m.title)}" onerror="this.classList.add('hidden'); this.previousElementSibling.classList.remove('hidden')">` : ''}
          </button>
          <div class="detail-metrics">
            <h2 class="card-title">${escapeHtml(m.title)}</h2>
            <div class="detail-sub"><span>${m.read.length} از ${m.total} چپتر</span><span>${pct}%</span></div>
            <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
            <div class="detail-last">${lastRead ? `آخرین چپتر خوانده‌شده: ${lastRead}` : 'هنوز چپتری تیک نخورده است'}</div>
          </div>
        </div>
        <div class="detail-actions">
          <button class="btn btn-primary" data-action="chapters">چپترها</button>
          <button class="btn" data-action="edit">ویرایش</button>
          <button class="btn danger-button" data-action="delete">حذف</button>
        </div>
      </article>
    `;
  }).join('');
}

function chooseCover(index) {
  if (!data[index]) return;
  if (nativeStorage) {
    AndroidStorage.chooseCover(data[index].id);
    return;
  }
  pendingBrowserCoverIndex = index;
  document.getElementById('cover-picker').click();
}

document.getElementById('cover-picker').addEventListener('change', (event) => {
  const file = event.target.files?.[0];
  const index = pendingBrowserCoverIndex;
  pendingBrowserCoverIndex = null;
  event.target.value = '';
  if (!file || !data[index]) return;
  const reader = new FileReader();
  reader.onload = () => {
    const picture = new Image();
    picture.onload = () => {
      const scale = Math.min(1, 700 / picture.width, 1000 / picture.height);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(picture.width * scale);
      canvas.height = Math.round(picture.height * scale);
      canvas.getContext('2d').drawImage(picture, 0, 0, canvas.width, canvas.height);
      data[index].coverData = canvas.toDataURL('image/jpeg', 0.82);
      data[index].cover = null;
      save();
      renderList();
    };
    picture.src = reader.result;
  };
  reader.readAsDataURL(file);
});

window.onAndroidCoverSaved = (id) => {
  const index = data.findIndex(m => m.id === id);
  if (index < 0) return;
  data[index].cover = `cover-${id}.jpg`;
  data[index].coverUpdated = Date.now();
  delete data[index].coverData;
  save();
  renderList();
};
window.onAndroidCoverError = () => alert('ذخیرهٔ جلد انجام نشد. پوشهٔ انتخاب‌شده را بررسی کن.');

function openChapters() {
  if (activeIndex === null) return;
  showView('chapters');
}

function renderChapters() {
  const m = data[activeIndex];
  if (!m) return showView('list');
  document.getElementById('chapters-title').textContent = m.title;
  currentSet = new Set(m.read);
  updateCounter();

  let html = '';
  for (let i = 1; i <= m.total; i++) {
    html += `<div class="chip ${currentSet.has(i) ? 'on' : ''}" id="chapter-${i}" data-ch="${i}">${i}</div>`;
  }
  document.getElementById('chips-container').innerHTML = html;
  const targetChapter = m.read.length ? Math.max(...m.read) : 1;
  requestAnimationFrame(() => document.getElementById(`chapter-${targetChapter}`)?.scrollIntoView({ block: 'center', behavior: 'smooth' }));
}

function updateCounter() {
  const m = data[activeIndex];
  document.getElementById('detail-progress').textContent = `${currentSet.size} / ${m.total}`;
}

/* =========================================
   تیک زدن تکی با تشخیص خودکار اسکرول (بدون لگ)
========================================= */
const chipsContainer = document.getElementById('chips-container');

// رویداد click خودش ذاتاً فرق اسکرول و کلیک واقعی رو در موبایل و دسکتاپ تشخیص میده
chipsContainer.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;

  const ch = +chip.dataset.ch;
  if (currentSet.has(ch)) {
    currentSet.delete(ch);
    chip.classList.remove('on');
  } else {
    currentSet.add(ch);
    chip.classList.add('on');
  }

  updateCounter();
  data[activeIndex].read = Array.from(currentSet).sort((a, b) => a - b);
  save();
  renderList();
});

/* =========================================
   مودال‌های افزودن، ویرایش و حذف
========================================= */
document.getElementById('btn-open-add').onclick = () => {
  openModal('افزودن مانهوا', `
    <form onsubmit="saveAdd(event)">
      <input id="in-title" placeholder="نام مانهوا" required>
      <input id="in-total" type="number" min="1" placeholder="تعداد کل چپترها" required>
      <input id="in-readto" type="number" min="0" placeholder="تا چپتر چند خوندی؟ (مثلا 180)">
      <div class="modal-actions">
        <button type="button" class="btn" data-close>انصراف</button>
        <button type="submit" class="btn btn-primary">ذخیره</button>
      </div>
    </form>
  `);
};

window.saveAdd = (e) => {
  e.preventDefault();
  const title = document.getElementById('in-title').value.trim();
  const total = +document.getElementById('in-total').value;
  let readTo = +(document.getElementById('in-readto').value || 0);

  if (readTo > total) readTo = total;
  const read = [];
  for (let i = 1; i <= readTo; i++) read.push(i);

  if (title && total > 0) {
    data.push({ id: createId(), title, total, read, cover: null });
    save();
    renderList();
    appModal.close();
  }
};

function editManhwa(index) {
  activeIndex = index;
  const m = data[activeIndex];
  if (!m) return;
  const maxRead = m.read.length ? Math.max(...m.read) : 0;

  openModal('ویرایش مانهوا', `
    <form onsubmit="saveEdit(event)">
      <input id="edit-title" required>
      <input id="edit-total" type="number" min="1" value="${m.total}" required>
      <input id="edit-readto" type="number" min="0" value="${maxRead}" placeholder="تا چپتر چند خوندی؟ (مثلا 180)">
      <div class="modal-actions">
        <button type="button" class="btn" data-close>انصراف</button>
        <button type="submit" class="btn btn-primary">ثبت تغییرات</button>
      </div>
    </form>
  `);
  document.getElementById('edit-title').value = m.title;
}

window.saveEdit = (e) => {
  e.preventDefault();
  const m = data[activeIndex];
  m.title = document.getElementById('edit-title').value.trim();
  m.total = +document.getElementById('edit-total').value;

  let readTo = +(document.getElementById('edit-readto').value || 0);
  if (readTo > m.total) readTo = m.total;

  m.read = [];
  for (let i = 1; i <= readTo; i++) m.read.push(i);

  save();
  renderList();
  appModal.close();
};

function askDelete(idx) {
  openModal('حذف مانهوا', `
    <p style="color:var(--sub-text); margin: 0 0 16px;">آیا از حذف «${escapeHtml(data[idx].title)}» مطمئنی؟</p>
    <div class="modal-actions">
      <button class="btn" data-close>خیر</button>
      <button class="btn" style="background:var(--danger); color:#fff; border:0;" onclick="confirmDelete(${idx})">بله، حذف بشه</button>
    </div>
  `);
}

window.confirmDelete = (idx) => {
  if (nativeStorage && data[idx]?.id) AndroidStorage.deleteCover(data[idx].id);
  data.splice(idx, 1);
  save();
  showView('list');
  appModal.close();
};

/* =========================================
   سایدبار و سوایپ لمسی
========================================= */
const toggleMenu = (open) => document.body.classList.toggle('menu-open', open);

window.handleNativeBack = () => {
  if (appModal.open) { appModal.close(); return true; }
  if (document.body.classList.contains('menu-open')) { toggleMenu(false); return true; }
  if (!document.getElementById('view-chapters').classList.contains('hidden')) { showView('list'); return true; }
  return false;
};

document.getElementById('manhwa-list').addEventListener('click', (event) => {
  const button = event.target.closest('[data-action]');
  const card = button?.closest('.manhwa-card');
  if (!button || !card) return;
  const index = Number(card.dataset.index);
  if (!data[index]) return;
  if (button.dataset.action === 'chapters') {
    activeIndex = index;
    openChapters();
  } else if (button.dataset.action === 'edit') {
    editManhwa(index);
  } else if (button.dataset.action === 'delete') {
    askDelete(index);
  }
});

document.getElementById('btn-menu').onclick = () => toggleMenu(true);
document.getElementById('backdrop').onclick = () => toggleMenu(false);
document.getElementById('btn-chapters-back').onclick = () => showView('list');

let touchStartX = 0;
document.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
}, { passive: true });

document.addEventListener('touchend', (e) => {
  const diffX = e.changedTouches[0].clientX - touchStartX;
  const isFromRightEdge = touchStartX > window.innerWidth - 30;

  if (isFromRightEdge && diffX < -50) toggleMenu(true);
  if (document.body.classList.contains('menu-open') && diffX > 60) toggleMenu(false);
}, { passive: true });

/* =========================================
   پشتیبان‌گیری (Export / Import)
========================================= */
document.getElementById('btn-export').onclick = () => {
  if (nativeStorage) {
    AndroidStorage.exportBackup(JSON.stringify(data, null, 2));
    toggleMenu(false);
    return;
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `manhwas-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  toggleMenu(false);
};

document.getElementById('btn-storage').onclick = () => {
  if (nativeStorage) AndroidStorage.chooseFolder();
  else alert('برای انتخاب پوشه، نسخهٔ اندروید را نصب کنید.');
};

window.onAndroidFolderPicked = (serialized, folderName) => {
  if (serialized) {
    const saved = JSON.parse(serialized);
    needsMigration = false;
    data = (Array.isArray(saved) ? saved : []).map(normalizeManhwa);
  }
  localStorage.setItem(KEY, JSON.stringify(data));
  save();
  document.getElementById('storage-status').textContent = `پوشهٔ ذخیره‌سازی: ${folderName}`;
  renderList();
};
window.onAndroidStorageReady = (folderName) => {
  if (folderName) document.getElementById('storage-status').textContent = `پوشهٔ ذخیره‌سازی: ${folderName}`;
};

// اجرای اولیه
showView('list');
</script>
<script>
  if (!(typeof AndroidStorage !== "undefined") && "serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js");
    });
  }
</script>
